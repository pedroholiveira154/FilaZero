<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina - Pagamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pagina-pagamento" class="pagina-etapa">
    <header class="cabecalho">
        <div class="triangulo-vermelho" aria-hidden="true"></div>
        <div class="conteudo-cabecalho">
            <p class="marca-cantina">CANTINA</p>
            <div class="moldura-logo">
                <img src="img/senai.jpg" alt="SENAI" class="logo-senai">
            </div>
        </div>
    </header>

    <main class="painel-pagina">
        <div class="barra-superior">
            <h1 class="somente-leitor-tela">Pagamento</h1>
            <button type="button" onclick="retornar()" class="botao-voltar">Voltar</button>
        </div>

        <section class="painel-etapa" aria-label="Forma de pagamento">

            <!-- Painel esquerdo: resumo do pedido -->
            <div id="resumo-total-pagamento" class="painel-resumo">
                <h2>Resumo do pedido</h2>

                <div id="preco-total"></div>

                <p class="texto-resumo">
                    Confira o valor total antes de continuar.
                </p>
            </div>

            <!-- Painel direito: seleção de pagamento -->
            <div class="area-pagamento">

                <h2>Como você gostaria de pagar?</h2>

                <div id="opcoes-pagamento">

                    <button type="button" class="botao-forma-pagamento" id="pagamento-pix" aria-pressed="false">
                        <span class="icone-pagamento">▦</span>
                        <span>Pix</span>
                    </button>

                    <button type="button" class="botao-forma-pagamento" id="pagamento-debito" aria-pressed="false">
                        <span class="icone-pagamento">▣</span>
                        <span>Débito</span>
                    </button>

                    <button type="button" class="botao-forma-pagamento" id="pagamento-credito" aria-pressed="false">
                        <span class="icone-pagamento">▣</span>
                        <span>Crédito</span>
                    </button>

                    <button type="button" class="botao-forma-pagamento" id="pagamento-dinheiro" aria-pressed="false">
                        <span class="icone-pagamento">＄</span>
                        <span>Dinheiro</span>
                    </button>

                    <button type="button" class="botao-forma-pagamento" id="pagamento-vale-refeicao"
                        aria-pressed="false">
                        <span class="icone-pagamento">▤</span>
                        <span>Vale-refeição</span>
                    </button>

                </div>

                <!-- Área que muda conforme o pagamento escolhido -->
                <div id="detalhes-pagamento" aria-live="polite">
                    <p>Selecione uma forma de pagamento para continuar.</p>
                </div>

            </div>

        </section>
    </main>

    <div class="barra-acao">
        <button type="button" onclick="pagar()" class="botao-acao">PAGAR</button>
    </div>

    <script src="_js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
